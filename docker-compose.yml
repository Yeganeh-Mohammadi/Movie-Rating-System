services:
  db:
    image: postgres:16
    container_name: movie-rating-system-db-1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movie_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      retries: 5

  app:
    build: .
    container_name: movie-rating-system-app-1
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/movie_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: always
    # دستور uvicorn برای اجرای دائمی وب‌اپلیکیشن
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: {}